[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Repository-local development and performance tooling for Agent Vigilo."
publish = false

[features]
performance-services = []

[[test]]
name = "performance_services"
path = "tests/performance_services.rs"
required-features = ["performance-services"]

[dependencies]
anyhow = "1.0.102"
aws-sdk-s3 = { version = "1.155.0", default-features = false, features = ["rt-tokio", "rustls", "default-https-client"] }
tokio = { version = "1.52.1", features = ["rt-multi-thread", "time"] }
blake3 = "1.8.5"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
postgres = { version = "0.19.12", features = ["with-serde_json-1"] }
rand = "0.9.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9"
toml = "1.1.2"
url = "2.5.8"
uuid = { version = "1.8", features = ["serde", "v5", "v7"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.23.0"

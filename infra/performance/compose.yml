name: ${VIGILO_PERF_PROJECT}

services:
  postgres:
    image: postgres:16-alpine
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track_planning=on
      - -c
      - track_io_timing=on
      - -c
      - track_wal_io_timing=on
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: vigilo_perf
      POSTGRES_USER: vigilo_perf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigilo_perf -d postgres"]
      interval: 2s
      timeout: 2s
      retries: 30
    labels:
      io.vigilo.performance: "true"
      io.vigilo.run-id: ${VIGILO_PERF_RUN_ID}
    ports:
      - "127.0.0.1::5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_PASS: vigilo_perf
      RABBITMQ_DEFAULT_USER: vigilo_perf
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
    labels:
      io.vigilo.performance: "true"
      io.vigilo.run-id: ${VIGILO_PERF_RUN_ID}
    ports:
      - "127.0.0.1::5672"
      - "127.0.0.1::15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  ceph:
    build:
      context: ../dev/ceph
    entrypoint: ["/bin/bash", "/opt/vigilo-ceph/start.sh"]
    init: true
    hostname: perf-ceph
    mem_limit: 4g
    environment:
      DEV_S3_ACCESS_KEY_ID: vigilo_perf
      DEV_S3_SECRET_ACCESS_KEY: vigilo_perf_storage_secret
      DEV_S3_BUCKET: vigilo-perf
    ports:
      - "127.0.0.1::3900"
    volumes:
      - ../dev/ceph:/opt/vigilo-ceph:ro
      - ceph-data:/var/lib/ceph/dev
    healthcheck:
      test: ["CMD", "python3.12", "/opt/vigilo-ceph/bucket.py", "check"]
      interval: 5s
      timeout: 10s
      retries: 36
      start_period: 30s
    stop_grace_period: 45s
    labels:
      io.vigilo.performance: "true"
      io.vigilo.run-id: ${VIGILO_PERF_RUN_ID}

networks:
  default:
    labels:
      io.vigilo.performance: "true"
      io.vigilo.run-id: ${VIGILO_PERF_RUN_ID}

volumes:
  postgres-data:
    labels:
      io.vigilo.performance: "true"
      io.vigilo.run-id: ${VIGILO_PERF_RUN_ID}
  rabbitmq-data:
    labels:
      io.vigilo.performance: "true"
      io.vigilo.run-id: ${VIGILO_PERF_RUN_ID}
  ceph-data:
    labels:
      io.vigilo.performance: "true"
      io.vigilo.run-id: ${VIGILO_PERF_RUN_ID}

# Single-node development cluster. The startup script adds its persisted FSID.
[global]
mon initial members = a
mon host = 127.0.0.1
public network = 127.0.0.0/8
cluster network = 127.0.0.0/8
keyring = /var/lib/ceph/dev/admin.keyring
run dir = /run/ceph
log to file = false
log to stderr = true
mon allow pool size one = true
osd pool default size = 1
osd pool default min size = 1
osd pool default pg num = 8
osd pool default pgp num = 8
osd pool default pg autoscale mode = off
osd crush chooseleaf type = 0
osd memory target = 1073741824

# A bounded sparse file in the Compose volume; no host device provisioning.
bluestore block size = 8589934592
bluestore block create = true
bluestore block db size = 0
bluestore block wal size = 0

[mon.a]
mon data = /var/lib/ceph/dev/mon

[osd.0]
osd data = /var/lib/ceph/dev/osd
crush location = root=default host=dev-ceph

[mgr.a]
mgr data = /var/lib/ceph/dev/mgr

[client.rgw.dev]
rgw frontends = beast port=3900

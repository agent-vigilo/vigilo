name: agent_vigilo_dev

x-vigilo-env: &vigilo-env
  DATABASE_URL: ${VIGILO_CONTAINER_DATABASE_URL:-postgresql://postgres:password@postgres:5432/agent_vigilo}
  DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-5}
  VIGILO_CONTROL_DATABASE_ALIAS: ${VIGILO_CONTROL_DATABASE_ALIAS:-primary}
  VIGILO_STORAGE_CONFIG: /workspace/infra/dev/storage.toml
  VIGILO_S3_READ_ENDPOINT: http://ceph:3900
  DEV_S3_ACCESS_KEY_ID: ${DEV_S3_ACCESS_KEY_ID:?Set DEV_S3_ACCESS_KEY_ID in the selected env file}
  DEV_S3_SECRET_ACCESS_KEY: ${DEV_S3_SECRET_ACCESS_KEY:?Set DEV_S3_SECRET_ACCESS_KEY in the selected env file}

x-vigilo-rust-service: &vigilo-rust-service
  image: rust:latest
  working_dir: /workspace
  volumes:
    - ../../:/workspace
    - agent_vigilo_cargo_registry:/usr/local/cargo/registry
    - agent_vigilo_cargo_git:/usr/local/cargo/git
    - agent_vigilo_target:/workspace/target
  networks:
    - agent_vigilo_network

services:
  ceph:
    build:
      context: ./ceph
    entrypoint: ["/bin/bash", "/opt/vigilo-ceph/start.sh"]
    init: true
    hostname: dev-ceph
    mem_limit: 4g
    environment:
      DEV_S3_ACCESS_KEY_ID: ${DEV_S3_ACCESS_KEY_ID:?Set DEV_S3_ACCESS_KEY_ID in the selected env file}
      DEV_S3_SECRET_ACCESS_KEY: ${DEV_S3_SECRET_ACCESS_KEY:?Set DEV_S3_SECRET_ACCESS_KEY in the selected env file}
      DEV_S3_BUCKET: ${DEV_S3_BUCKET:?Set DEV_S3_BUCKET in the selected env file}
    ports:
      - "127.0.0.1:${DEV_S3_PORT:-3900}:3900"
    volumes:
      - ./ceph:/opt/vigilo-ceph:ro
      - agent_vigilo_ceph_data:/var/lib/ceph/dev
    networks:
      - agent_vigilo_network
    healthcheck:
      test: ["CMD", "python3.12", "/opt/vigilo-ceph/bucket.py", "check"]
      interval: 5s
      timeout: 10s
      retries: 36
      start_period: 30s
    stop_grace_period: 45s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: agent_vigilo
    ports:
      - "5432:5432"
    volumes:
      - agent_vigilo_db_data:/var/lib/postgresql/data
    networks:
      - agent_vigilo_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent_vigilo"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - agent_vigilo_mq_data:/var/lib/rabbitmq
    networks:
      - agent_vigilo_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  agent:
    image: ghcr.io/ggml-org/llama.cpp:server
    command:
      - -m
      - /models/${VIGILO_AGENT_MODEL:-qwen2.5-0.5b-instruct-q4_k_m.gguf}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    ports:
      - "8080:8080"
    volumes:
      - ../../models:/models:ro
    networks:
      - agent_vigilo_network
    restart: unless-stopped

  setup:
    <<: *vigilo-rust-service
    command: ["cargo", "run", "-p", "vigilo", "--", "setup", "--skip-evaluators"]
    environment:
      <<: *vigilo-env
      VIGILO_DEFAULT_SHARD_DATABASE_ALIAS: ${VIGILO_DEFAULT_SHARD_DATABASE_ALIAS:-primary}
      VIGILO_SHARD_ASSIGNMENT_POLICY: ${VIGILO_SHARD_ASSIGNMENT_POLICY:-single-default}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  coordinator:
    <<: *vigilo-rust-service
    command: ["cargo", "run", "-p", "vigilo", "--", "coordinator", "start"]
    environment:
      <<: *vigilo-env
      MESSAGING_URL: ${VIGILO_CONTAINER_MESSAGING_URL:-amqp://guest:guest@rabbitmq:5672}
      VIGILO_DATABASE_OPERATION_TIMEOUT_SECONDS: ${VIGILO_DATABASE_OPERATION_TIMEOUT_SECONDS:-30}
      VIGILO_RUN_CREATION_CASE_BATCH_SIZE: ${VIGILO_RUN_CREATION_CASE_BATCH_SIZE:-1000}
      VIGILO_RUN_CREATION_CASE_PAGE_BUDGET: ${VIGILO_RUN_CREATION_CASE_PAGE_BUDGET:-64}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ceph:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    <<: *vigilo-rust-service
    command: ["cargo", "run", "-p", "vigilo", "--", "worker", "start"]
    environment:
      <<: *vigilo-env
      MESSAGING_URL: ${VIGILO_CONTAINER_MESSAGING_URL:-amqp://guest:guest@rabbitmq:5672}
      VIGILO_DATABASE_OPERATION_TIMEOUT_SECONDS: ${VIGILO_DATABASE_OPERATION_TIMEOUT_SECONDS:-30}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ceph:
        condition: service_healthy
      agent:
        condition: service_started
      setup:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      replicas: ${WORKER_REPLICAS:-1}

volumes:
  agent_vigilo_ceph_data:
  agent_vigilo_db_data:
  agent_vigilo_mq_data:
  agent_vigilo_cargo_registry:
  agent_vigilo_cargo_git:
  agent_vigilo_target:

networks:
  agent_vigilo_network:
    driver: bridge

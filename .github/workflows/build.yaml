name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  all-go:
    name: All Systems Go
    runs-on: ubuntu-latest
    needs:
      - rustfmt
      - clippy
      - unit-tests
      - database-integration-tests
      - migration-tests
      - end-to-end-tests
      - blob-storage-services
      - coverage-report
      - evaluator-wasm
      - web
    steps:
      - run: exit 0

  rustfmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo +nightly fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy -p vigilo --locked --features blob-storage-services --test blob_storage_services --test dataset_ingestion_services -- -D warnings

  unit-tests:
    name: Unit and Contract Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            coverage: true
          - os: windows-latest
            coverage: false
          - os: macos-latest
            coverage: false
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install LLVM coverage tools
        if: matrix.coverage
        run: rustup component add llvm-tools-preview
      - name: Install cargo-llvm-cov
        if: matrix.coverage
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Run service-free tests
        if: ${{ !matrix.coverage }}
        run: cargo test --workspace --locked --lib --bins --verbose
      - name: Run service-free tests with coverage
        if: matrix.coverage
        run: >-
          cargo llvm-cov --no-report --workspace --locked --lib --bins
      - name: Run performance contract check with coverage
        if: matrix.coverage
        run: cargo llvm-cov run --no-report -p xtask --locked -- perf check
      - name: Run performance service tests with coverage
        if: matrix.coverage
        run: >-
          cargo llvm-cov --no-report -p xtask --locked
          --features performance-services --test performance_services -- --nocapture
      - name: Generate unit and performance coverage report
        if: matrix.coverage
        run: >-
          cargo llvm-cov report
          --ignore-filename-regex '[/\\]postgres_tests(\.rs|[/\\])'
          --lcov --output-path lcov-unit.info
      - name: Store unit and performance coverage
        if: matrix.coverage
        uses: actions/upload-artifact@v6
        with:
          name: coverage-unit
          path: lcov-unit.info
          if-no-files-found: error
          retention-days: 1

  database-integration-tests:
    name: Database Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/postgres
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Reset coverage data
        run: cargo llvm-cov clean --workspace
      - name: Migrate PostgreSQL template1 for SQLx test clones
        run: >-
          cargo llvm-cov run --no-report -p vigilo --locked --
          setup --skip-evaluators
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/template1
      - name: Run PostgreSQL-backed SQLx tests with coverage
        run: >-
          cargo llvm-cov --no-report -p vigilo --locked --bin vigilo
          -- --ignored --nocapture --test-threads=4
      - name: Generate SQLx coverage report
        run: >-
          cargo llvm-cov report
          --ignore-filename-regex '[/\\]postgres_tests(\.rs|[/\\])'
          --lcov --output-path lcov-sqlx.info
      - name: Store SQLx coverage
        uses: actions/upload-artifact@v6
        with:
          name: coverage-sqlx
          path: lcov-sqlx.info
          if-no-files-found: error
          retention-days: 1

  migration-tests:
    name: Migration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: agent_vigilo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_vigilo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/agent_vigilo
      MESSAGING_URL: amqp://guest:guest@localhost:5672
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply migrations to a fresh database
        run: cargo run --quiet -p vigilo --locked -- setup --skip-evaluators
        env:
          RUSTFLAGS: -Awarnings

  end-to-end-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres-primary:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: agent_vigilo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_vigilo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      postgres-shard:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: agent_vigilo
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_vigilo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:3-management
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 20s
    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/agent_vigilo
      VIGILO_TEST_SHARD_001_DATABASE_URL: postgresql://postgres:password@localhost:5433/agent_vigilo
      MESSAGING_URL: amqp://guest:guest@localhost:5672
      DEV_S3_ACCESS_KEY_ID: vigilo-ci-runtime
      DEV_S3_SECRET_ACCESS_KEY: vigilo-ci-runtime-secret
      DEV_S3_BUCKET: vigilo-ci-runtime
      DEV_S3_PORT: 13900
      COMPOSE_PROJECT_NAME: vigilo-runtime-${{ github.run_id }}-${{ github.run_attempt }}
      VIGILO_STORAGE_CONFIG: ${{ github.workspace }}/target/runtime-storage.toml
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
          targets: wasm32-wasip2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Start isolated runtime object storage
        run: |
          docker compose -p "$COMPOSE_PROJECT_NAME" -f infra/dev/docker-compose.single.yml up -d --build --wait --wait-timeout 240 ceph
          mkdir -p target
          cat > "$VIGILO_STORAGE_CONFIG" <<'EOF'
          provider = 's3'
          alias = 'cases'
          bucket = 'vigilo-ci-runtime'
          prefix = 'runtime-tests'
          region = 'us-east-1'
          endpoint = 'http://127.0.0.1:13900'
          allow_http = true
          path_style = true
          [credential_variables]
          access_key = 'DEV_S3_ACCESS_KEY_ID'
          secret_key = 'DEV_S3_SECRET_ACCESS_KEY'
          EOF
      - name: Reset coverage data
        run: cargo llvm-cov clean --workspace
      - name: Build the end-to-end evaluator
        run: cargo build -p sentiment-basic-en --target wasm32-wasip2 --release --locked
      - name: Run routing integration tests with coverage
        run: >-
          cargo llvm-cov --no-report -p vigilo --locked
          --test multi_database_routing -- --nocapture
      - name: Run distributed runtime tests with coverage
        run: >-
          cargo llvm-cov --no-report -p vigilo --locked
          --test multi_database_e2e -- --nocapture
        env:
          VIGILO_E2E_MULTI_DATABASE: "1"
      - name: Generate end-to-end coverage report
        run: >-
          cargo llvm-cov report
          --ignore-filename-regex '[/\\]postgres_tests(\.rs|[/\\])'
          --lcov --output-path lcov-e2e.info
      - name: Store end-to-end coverage
        uses: actions/upload-artifact@v6
        with:
          name: coverage-e2e
          path: lcov-e2e.info
          if-no-files-found: error
          retention-days: 1
      - name: Remove isolated runtime object storage
        if: always()
        run: >-
          docker compose -p "$COMPOSE_PROJECT_NAME"
          -f infra/dev/docker-compose.single.yml
          down --volumes --remove-orphans --timeout 45

  blob-storage-services:
    name: Blob Storage Acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: postgres
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:password@localhost:15432/postgres
      DEV_S3_ACCESS_KEY_ID: vigilo-ci-storage
      DEV_S3_SECRET_ACCESS_KEY: vigilo-ci-storage-secret
      DEV_S3_BUCKET: vigilo-ci-storage
      DEV_S3_PORT: 13900
      COMPOSE_PROJECT_NAME: vigilo-storage-${{ github.run_id }}-${{ github.run_attempt }}
      VIGILO_BLOB_TEST_ENDPOINT: http://127.0.0.1:13900
      VIGILO_BLOB_TEST_BUCKET: vigilo-ci-storage
      VIGILO_BLOB_TEST_ACCESS_KEY_ID: vigilo-ci-storage
      VIGILO_BLOB_TEST_SECRET_ACCESS_KEY: vigilo-ci-storage-secret
      VIGILO_BLOB_TEST_INVALID_SECRET_ACCESS_KEY: deliberately-invalid
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Start isolated Ceph gateway
        run: >-
          docker compose -p "$COMPOSE_PROJECT_NAME"
          -f infra/dev/docker-compose.single.yml
          up -d --build --wait --wait-timeout 240 ceph
      - name: Apply schema through setup to a fresh control database
        run: cargo llvm-cov run --no-report -p vigilo --locked -- setup --skip-evaluators
      - name: Verify signed storage and restart persistence with coverage
        run: >-
          VIGILO_BLOB_TEST_RESTART_CONTAINER="${COMPOSE_PROJECT_NAME}-ceph-1"
          cargo llvm-cov --no-report -p vigilo --locked
          --features blob-storage-services --test blob_storage_services
          signed_storage_contract -- --exact --nocapture
      - name: Verify transport faults with coverage
        run: >-
          cargo llvm-cov --no-report -p vigilo --locked
          --features blob-storage-services --test blob_storage_services
          ceph_fault_contract -- --exact --nocapture
      - name: Verify upload and run-plan process recovery with exact cleanup and coverage
        run: >-
          cargo llvm-cov --no-report -p vigilo --locked
          --features blob-storage-services --test dataset_ingestion_services -- --nocapture
      - name: Generate storage coverage report
        run: >-
          cargo llvm-cov report
          --ignore-filename-regex '[/\\]postgres_tests(\.rs|[/\\])'
          --lcov --output-path lcov-storage.info
      - name: Store storage coverage
        uses: actions/upload-artifact@v6
        with:
          name: coverage-storage
          path: lcov-storage.info
          if-no-files-found: error
          retention-days: 1
      - name: Remove isolated service and volumes
        if: always()
        run: >-
          docker compose -p "$COMPOSE_PROJECT_NAME"
          -f infra/dev/docker-compose.single.yml
          down --volumes --remove-orphans --timeout 45

  coverage-report:
    name: Aggregate Rust Coverage
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - database-integration-tests
      - end-to-end-tests
      - blob-storage-services
    steps:
      - uses: actions/checkout@v6
      - name: Download coverage reports
        uses: actions/download-artifact@v7
        with:
          pattern: coverage-*
          path: coverage
          merge-multiple: true
      - name: Install LCOV
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes lcov
      - name: Merge Rust coverage reports
        run: >-
          lcov
          --add-tracefile coverage/lcov-unit.info
          --add-tracefile coverage/lcov-sqlx.info
          --add-tracefile coverage/lcov-e2e.info
          --add-tracefile coverage/lcov-storage.info
          --output-file coverage/lcov-rust-all.info
      - name: Enforce aggregate Rust coverage
        run: >-
          lcov --summary coverage/lcov-rust-all.info
          --fail-under-lines 80
      - name: Upload aggregate coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: coverage/lcov-rust-all.info
          flags: rust-all
          name: rust-all
          disable_search: true
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  evaluator-wasm:
    name: Evaluator Wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - name: Build evaluator ABI fixtures
        run: |
          mapfile -t packages < <(
            cargo metadata --no-deps --format-version 1 |
              jq -r '.packages[] | select(.metadata.vigilo["abi-fixture"] == true) | .name'
          )
          test "${#packages[@]}" -gt 0
          package_args=()
          for package in "${packages[@]}"; do
            package_args+=(--package "$package")
          done
          cargo build --target wasm32-wasip2 --release --locked "${package_args[@]}"
      - name: Verify evaluator ABI compatibility
        run: >-
          cargo test -p vigilo --locked --bin vigilo
          --features evaluator-abi-fixtures
          evaluator_abi::tests::all_registered_evaluator_abis_execute_in_one_host
          -- --exact

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

name: Publish Vigilo Crate

on:
  release:
    types: [published]

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-vigilo-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Vigilo to crates.io
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    environment: crates-io
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify release tag matches the crate version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(python3 scripts/releases/crate.py --tag "$RELEASE_TAG")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Require successful CI for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          passed="$(gh api --method GET "repos/$GH_REPO/actions/workflows/build.yaml/runs" \
            -f head_sha="$GITHUB_SHA" -f per_page=100 \
            --jq '[.workflow_runs[] | select(.head_sha == env.GITHUB_SHA and .status == "completed" and .conclusion == "success" and (.event == "push" or .event == "workflow_dispatch"))] | length')"
          if [[ "$passed" -lt 1 ]]; then
            echo "The Build workflow must pass for $GITHUB_SHA before publication. Rerun this job after CI succeeds." >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch locked build dependencies
        run: cargo fetch --locked
      - name: Verify the packaged crate outside the workspace
        id: package
        run: |
          python3 scripts/releases/verify_package.py --checksum-output "$RUNNER_TEMP/vigilo-checksum"
          echo "checksum=$(cat "$RUNNER_TEMP/vigilo-checksum")" >> "$GITHUB_OUTPUT"
      - name: Check for an identical published crate
        id: registry
        env:
          CRATE_VERSION: ${{ steps.version.outputs.version }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
        run: |
          published="$(python3 scripts/releases/registry.py --version "$CRATE_VERSION" --checksum "$CHECKSUM")"
          echo "published=$published" >> "$GITHUB_OUTPUT"
          if [[ "$published" == true ]]; then
            echo "Verified the published vigilo $CRATE_VERSION checksum." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish to crates.io
        if: steps.registry.outputs.published != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [[ -z "$CARGO_REGISTRY_TOKEN" ]]; then
            echo "Configure CARGO_REGISTRY_TOKEN for the crates-io environment." >&2
            exit 1
          fi
          cargo publish -p vigilo --locked
      - name: Verify publication on crates.io
        if: steps.registry.outputs.published != 'true'
        env:
          CRATE_VERSION: ${{ steps.version.outputs.version }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
        run: python3 scripts/releases/registry.py --version "$CRATE_VERSION" --checksum "$CHECKSUM" --wait

  deploy-docs:
    name: Deploy Vigilo release docs
    needs: publish
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-web.yaml
    with:
      release_tag: ${{ github.event.release.tag_name }}
      release_sha: ${{ github.sha }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

name: Deploy Web

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      release_sha:
        required: true
        type: string
    secrets:
      AWS_ROLE_ARN:
        required: true

  workflow_dispatch:
    inputs:
      release_tag:
        description: Published tag such as v0.1.0 (blank selects the deployed latest release)
        type: string
      docs_correction_sha:
        description: Optional exact SHA of a web-only correction for the latest release
        type: string
      apply_archive_policy:
        description: Apply the archived release lines from web/docs-release-policy.json
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-web-production
  queue: max

jobs:
  deploy:
    name: Deploy Vigilo Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Publish versioned docs
        env:
          GH_TOKEN: ${{ github.token }}
          VIGILO_RELEASE_TAG: ${{ inputs.release_tag }}
          VIGILO_RELEASE_SHA: ${{ inputs.release_sha }}
          VIGILO_DOCS_CORRECTION_SHA: ${{ inputs.docs_correction_sha }}
          VIGILO_APPLY_ARCHIVE_POLICY: ${{ inputs.apply_archive_policy }}
        run: bash web/scripts/deploy-docs.sh
